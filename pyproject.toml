[project]
name = "Pac-Man"
version = "0.1.0"
description = "The famous arcade game Pac-Man with a modern Python codebase, a clean project structure, and a deployable build."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "marberge", email = "marberge@student.42lyon.fr" },
    { name = "gchmilew", email = "gchmilew@student.42lyon.fr" }
]
dependencies = [
    "pygame>=2.6.1",
]

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "mypy>=1.20.0",
    "pytest>=9.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.mypy]
strict = true
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
